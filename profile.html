<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์ของฉัน - CONCERT TICKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1d183b 0%, #0b0918 100%);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .container {
            max-width: 900px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #a5b4fc;
            text-decoration: none;
            font-size: 0.95rem;
            margin-bottom: 22px;
            transition: 0.2s;
        }

        .back-link:hover {
            color: #ff2a85;
            transform: translateX(-3px);
        }

        /* Profile Card */
        .profile-card {
            background: linear-gradient(145deg, #1b1736, #120f26);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 36px 24px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
            margin-bottom: 35px;
        }

        .profile-avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 auto 14px;
            box-shadow: 0 8px 25px rgba(0, 198, 255, 0.35);
        }

        .profile-name {
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .profile-meta {
            color: #9ca3af;
            font-size: 0.92rem;
            margin-bottom: 22px;
        }

        .balance-box {
            display: inline-block;
            background: rgba(13, 11, 30, 0.9);
            border: 1px solid rgba(0, 230, 118, 0.35);
            border-radius: 18px;
            padding: 16px 34px;
        }

        .balance-label {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .balance-amount {
            font-size: 1.9rem;
            font-weight: 700;
            color: #00e676;
        }

        /* History Section */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 22px;
        }

        .section-title {
            font-size: 1.35rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ticket-count-badge {
            background: linear-gradient(90deg, #ff2a85, #9c27b0);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* E-Ticket Cards */
        .ticket-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .e-ticket {
            display: flex;
            background: #181430;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
            position: relative;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .e-ticket:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 229, 255, 0.45);
        }

        /* แถบสีด้านซ้ายของตั๋ว */
        .ticket-strip {
            width: 12px;
            background: linear-gradient(180deg, #ff2a85, #00e5ff);
            flex-shrink: 0;
        }

        .ticket-strip.theme-starlight {
            background: linear-gradient(180deg, #00e5ff, #1565c0);
        }

        .ticket-strip.theme-cyberpunk {
            background: linear-gradient(180deg, #ffea00, #ff6f00);
        }

        .ticket-strip.theme-midnight {
            background: linear-gradient(180deg, #00e676, #00897b);
        }

        /* ส่วนรายละเอียดหลักของตั๋ว */
        .ticket-main {
            flex: 1;
            padding: 20px 24px;
            border-right: 2px dashed rgba(255, 255, 255, 0.16);
            position: relative;
        }

        /* รอยปรุครึ่งวงกลมด้านบน-ล่าง */
        .ticket-main::before,
        .ticket-main::after {
            content: "";
            position: absolute;
            right: -11px;
            width: 20px;
            height: 20px;
            background: #0f0c22;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ticket-main::before {
            top: -11px;
        }

        .ticket-main::after {
            bottom: -11px;
        }

        .ticket-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .ticket-code {
            font-size: 0.8rem;
            color: #00e5ff;
            background: rgba(0, 229, 255, 0.1);
            padding: 3px 10px;
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .ticket-status {
            font-size: 0.8rem;
            color: #00e676;
            background: rgba(0, 230, 118, 0.12);
            padding: 3px 10px;
            border-radius: 8px;
            font-weight: 600;
        }

        .ticket-concert {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .ticket-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .badge-item {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 0.88rem;
            color: #e5e7eb;
        }

        .badge-item strong {
            color: #ff7ae6;
        }

        .ticket-date {
            font-size: 0.82rem;
            color: #9ca3af;
        }

        /* ส่วนสรุปยอดด้านขวาของตั๋ว */
        .ticket-side {
            min-width: 165px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .side-label {
            font-size: 0.78rem;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .side-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffea00;
        }

        .empty-state {
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 40px 20px;
            text-align: center;
            color: #9ca3af;
        }

        @media (max-width: 650px) {
            .e-ticket {
                flex-direction: column;
            }

            .ticket-strip {
                width: 100%;
                height: 8px;
            }

            .ticket-main {
                border-right: none;
                border-bottom: 2px dashed rgba(255, 255, 255, 0.16);
            }

            .ticket-main::before,
            .ticket-main::after {
                display: none;
            }

            .ticket-side {
                flex-direction: row;
                justify-content: space-between;
                min-width: auto;
                padding: 14px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="app.html" class="back-link">← กลับไปหน้าจองบัตร</a>

        <!-- การ์ดข้อมูลผู้ใช้ -->
        <div class="profile-card">
            <div class="profile-avatar" id="profileAvatar">P</div>
            <div class="profile-name" id="profileName">paman</div>
            <div class="profile-meta" id="profileMeta">อีเมล: piyakeiyrt170@gmail.com | เบอร์โทร: 0939782430</div>

            <div class="balance-box">
                <div class="balance-label">จำนวนเงินคงเหลือ</div>
                <div class="balance-amount" id="balanceAmount">10,501 ฿</div>
            </div>
        </div>

        <!-- หัวข้อประวัติการจอง -->
        <div class="section-header">
            <h2 class="section-title">🎟️ ประวัติการจองบัตร (E-Ticket)</h2>
            <span class="ticket-count-badge" id="ticketCountBadge">0 รายการ</span>
        </div>

        <!-- รายการตั๋ว -->
        <div class="ticket-list" id="ticketList"></div>
    </div>

    <script>
        function getThemeClass(concertName) {
            const upper = (concertName || '').toUpperCase();
            if (upper.includes('STARLIGHT')) return 'theme-starlight';
            if (upper.includes('CYBERPUNK')) return 'theme-cyberpunk';
            if (upper.includes('MIDNIGHT')) return 'theme-midnight';
            return '';
        }

        function renderBookings() {
            const savedUser = localStorage.getItem('currentUser') || localStorage.getItem('username') || 'paman';
            document.getElementById('profileName').textContent = savedUser;
            document.getElementById('profileAvatar').textContent = savedUser.charAt(0).toUpperCase();

            const savedBalance = localStorage.getItem('balance');
            if (savedBalance !== null && !isNaN(Number(savedBalance))) {
                document.getElementById('balanceAmount').textContent = Number(savedBalance).toLocaleString() + ' ฿';
            }

            const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
            const listEl = document.getElementById('ticketList');
            const badgeEl = document.getElementById('ticketCountBadge');

            badgeEl.textContent = bookings.length + ' รายการ';

            if (bookings.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        ยังไม่มีประวัติการจองบัตร ลองเลือกคอนเสิร์ตที่ถูกใจจากหน้าจองบัตรได้เลยครับ
                    </div>
                `;
                return;
            }

            // แสดงรายการล่าสุดขึ้นก่อน โดยคงเลขลำดับตั๋วเดิมไว้
            const indexedBookings = bookings.map((item, idx) => ({ ...item, index: idx }));
            indexedBookings.reverse();

            listEl.innerHTML = indexedBookings.map((item) => {
                const ticketCode = item.ticketCode || ('#TKT-' + String(1001 + item.index));
                const concertTitle = item.concert || 'CONCERT TICKET';
                const zoneText = item.zone || '-';
                const qtyText = item.quantity ? (item.quantity + ' ใบ') : '1 ใบ';
                const priceText = item.totalPrice
                    ? (Number(item.totalPrice).toLocaleString() + ' บาท')
                    : 'ชำระแล้ว';
                const dateText = item.date || '-';
                const themeClass = getThemeClass(concertTitle);

                return `
                    <div class="e-ticket">
                        <div class="ticket-strip ${themeClass}"></div>
                        <div class="ticket-main">
                            <div class="ticket-top-row">
                                <span class="ticket-code">${ticketCode}</span>
                                <span class="ticket-status">✓ ยืนยันการจองแล้ว</span>
                            </div>
                            <div class="ticket-concert">${concertTitle}</div>
                            <div class="ticket-badges">
                                <span class="badge-item">โซน: <strong>${zoneText}</strong></span>
                                <span class="badge-item">จำนวน: <strong>${qtyText}</strong></span>
                            </div>
                            <div class="ticket-date">จองเมื่อ: ${dateText}</div>
                        </div>
                        <div class="ticket-side">
                            <div class="side-label">ยอดชำระรวม</div>
                            <div class="side-price">${priceText}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.onload = renderBookings;
    </script>

</body>
</html>
