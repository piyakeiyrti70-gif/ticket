<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์ของฉัน - CONCERT TICKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1d183b 0%, #0b0918 100%);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #a5b4fc;
            text-decoration: none;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .back-link:hover {
            color: #00e5ff;
            transform: translateX(-3px);
        }

        .logout-btn {
            background: rgba(255, 42, 133, 0.14);
            color: #ff6b9d;
            border: 1px solid rgba(255, 42, 133, 0.4);
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }

        .logout-btn:hover {
            background: linear-gradient(90deg, #ff2a85, #e11d48);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 6px 20px rgba(255, 42, 133, 0.35);
        }

        /* Profile Card */
        .profile-card {
            background: linear-gradient(145deg, #1b1736, #120f26);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 36px 24px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
            margin-bottom: 28px;
        }

        .profile-avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 auto 14px;
            box-shadow: 0 8px 25px rgba(0, 198, 255, 0.35);
        }

        .profile-name {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .profile-meta {
            color: #9ca3af;
            font-size: 0.92rem;
            margin-bottom: 24px;
        }

        .balance-box {
            display: inline-block;
            background: rgba(13, 11, 30, 0.92);
            border: 1px solid rgba(0, 230, 118, 0.35);
            border-radius: 18px;
            padding: 16px 38px;
        }

        .balance-label {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .balance-amount {
            font-size: 2rem;
            font-weight: 700;
            color: #00e676;
        }

        /* History Section Header + Toggle Button */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
            background: rgba(24, 20, 48, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 14px 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ticket-count-badge {
            background: linear-gradient(90deg, #ff2a85, #9c27b0);
            padding: 4px 13px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .toggle-history-btn {
            background: rgba(0, 229, 255, 0.12);
            border: 1px solid rgba(0, 229, 255, 0.35);
            color: #00e5ff;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.25s;
        }

        .toggle-history-btn:hover {
            background: rgba(0, 229, 255, 0.22);
            transform: translateY(-1px);
        }

        .chevron-icon {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .chevron-icon.rotated {
            transform: rotate(180deg);
        }

        /* Collapsible Wrapper */
        .collapsible-wrapper {
            overflow: hidden;
            max-height: 3000px;
            opacity: 1;
            transition: max-height 0.45s ease, opacity 0.3s ease, margin-bottom 0.35s ease;
            margin-bottom: 32px;
        }

        .collapsible-wrapper.collapsed {
            max-height: 0;
            opacity: 0;
            margin-bottom: 18px;
            pointer-events: none;
        }

        /* E-Ticket Cards */
        .ticket-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .e-ticket {
            display: flex;
            background: #181430;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
            position: relative;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .e-ticket:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 229, 255, 0.45);
        }

        .ticket-strip {
            width: 12px;
            background: linear-gradient(180deg, #ff2a85, #00e5ff);
            flex-shrink: 0;
        }

        .ticket-strip.theme-starlight {
            background: linear-gradient(180deg, #00e5ff, #1565c0);
        }

        .ticket-strip.theme-cyberpunk {
            background: linear-gradient(180deg, #ffea00, #ff6f00);
        }

        .ticket-strip.theme-midnight {
            background: linear-gradient(180deg, #00e676, #00897b);
        }

        .ticket-main {
            flex: 1;
            padding: 20px 24px;
            border-right: 2px dashed rgba(255, 255, 255, 0.16);
            position: relative;
        }

        .ticket-main::before,
        .ticket-main::after {
            content: "";
            position: absolute;
            right: -11px;
            width: 20px;
            height: 20px;
            background: #0f0c22;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ticket-main::before {
            top: -11px;
        }

        .ticket-main::after {
            bottom: -11px;
        }

        .ticket-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .ticket-code {
            font-size: 0.8rem;
            color: #00e5ff;
            background: rgba(0, 229, 255, 0.1);
            padding: 3px 10px;
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .ticket-status {
            font-size: 0.8rem;
            color: #00e676;
            background: rgba(0, 230, 118, 0.12);
            padding: 3px 10px;
            border-radius: 8px;
            font-weight: 600;
        }

        .ticket-concert {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .ticket-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .badge-item {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 0.88rem;
            color: #e5e7eb;
        }

        .badge-item strong {
            color: #ff7ae6;
        }

        .ticket-date {
            font-size: 0.82rem;
            color: #9ca3af;
        }

        .ticket-side {
            min-width: 165px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .side-label {
            font-size: 0.78rem;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .side-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffea00;
        }

        .empty-state {
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 40px 20px;
            text-align: center;
            color: #9ca3af;
        }

        /* Top-up Box */
        .panel-card {
            background: #181430;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        .panel-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quick-amounts {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        .quick-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #e5e7eb;
            padding: 7px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .quick-btn:hover {
            border-color: #00e5ff;
            color: #00e5ff;
            background: rgba(0, 229, 255, 0.08);
        }

        .topup-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .topup-input {
            flex: 1;
            min-width: 180px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #100d24;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }

        .topup-input:focus {
            border-color: #00e676;
        }

        .topup-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #00b09b, #00e676);
            color: #0b0918;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .topup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.35);
        }

        .slip-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed rgba(255, 255, 255, 0.16);
            border-radius: 14px;
            padding: 12px 16px;
        }

        .slip-label {
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .slip-preview {
            display: none;
            margin-top: 12px;
            align-items: center;
            gap: 12px;
        }

        .slip-preview.show {
            display: flex;
        }

        .slip-preview img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(0, 229, 255, 0.4);
        }

        .status-msg {
            margin-top: 12px;
            font-size: 0.92rem;
            min-height: 20px;
            color: #00e676;
        }

        @media (max-width: 650px) {
            .e-ticket {
                flex-direction: column;
            }

            .ticket-strip {
                width: 100%;
                height: 8px;
            }

            .ticket-main {
                border-right: none;
                border-bottom: 2px dashed rgba(255, 255, 255, 0.16);
            }

            .ticket-main::before,
            .ticket-main::after {
                display: none;
            }

            .ticket-side {
                flex-direction: row;
                justify-content: space-between;
                min-width: auto;
                padding: 14px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- แถบนำทางด้านบน + ปุ่มออกจากระบบ -->
        <div class="top-bar">
            <a href="app.html" class="back-link">← กลับไปหน้าจองบัตร</a>
            <button class="logout-btn" onclick="logout()">ออกจากระบบ</button>
        </div>

        <!-- การ์ดข้อมูลผู้ใช้ -->
        <div class="profile-card">
            <div class="profile-avatar" id="profileAvatar">P</div>
            <div class="profile-name" id="profileName">paman</div>
            <div class="profile-meta" id="profileMeta">อีเมล: piyakeiyrt170@gmail.com | เบอร์โทร: 0939782430</div>

            <div class="balance-box">
                <div class="balance-label">จำนวนเงินคงเหลือ</div>
                <div class="balance-amount" id="balanceAmount">10,501 ฿</div>
            </div>
        </div>

        <!-- หัวข้อประวัติการจอง + ปุ่มเปิด/ย่อรายการ -->
        <div class="section-header">
            <div class="header-left">
                <h2 class="section-title">🎟️ ประวัติการจองบัตร (E-Ticket)</h2>
                <span class="ticket-count-badge" id="ticketCountBadge">0 รายการ</span>
            </div>
            <button type="button" class="toggle-history-btn" id="toggleHistoryBtn" onclick="toggleHistory()">
                <span id="toggleHistoryText">ย่อรายการ</span>
                <span class="chevron-icon" id="toggleChevron">▲</span>
            </button>
        </div>

        <!-- กล่องรายการตั๋วแบบย่อ/เปิดได้ -->
        <div class="collapsible-wrapper" id="historyWrapper">
            <div class="ticket-list" id="ticketList"></div>
        </div>

        <!-- ระบบเติมเงิน -->
        <div class="panel-card">
            <div class="panel-title">💳 ระบบเติมเงิน (ผ่าน QR Code / สลิป)</div>

            <div class="quick-amounts">
                <button type="button" class="quick-btn" onclick="setAmount(500)">+500 ฿</button>
                <button type="button" class="quick-btn" onclick="setAmount(1000)">+1,000 ฿</button>
                <button type="button" class="quick-btn" onclick="setAmount(2500)">+2,500 ฿</button>
                <button type="button" class="quick-btn" onclick="setAmount(5000)">+5,000 ฿</button>
            </div>

            <div class="topup-row">
                <input type="number" id="topupAmount" class="topup-input" placeholder="ระบุจำนวนเงินที่ต้องการเติม (บาท)" min="1">
                <button type="button" class="topup-btn" onclick="topUpBalance()">ยืนยันเติมเงิน</button>
            </div>

            <div class="slip-row">
                <span class="slip-label">แนบรูปสลิปการโอนเงิน (ถ้ามี):</span>
                <input type="file" id="slipInput" accept="image/*" onchange="previewSlip(event)">
            </div>

            <div class="slip-preview" id="slipPreview">
                <img id="slipImg" src="" alt="ตัวอย่างสลิป">
                <span id="slipName" style="font-size: 0.88rem; color: #00e5ff;"></span>
            </div>

            <div class="status-msg" id="topupMsg"></div>
        </div>
    </div>

    <script>
        let isHistoryOpen = true;

        function toggleHistory() {
            isHistoryOpen = !isHistoryOpen;
            const wrapper = document.getElementById('historyWrapper');
            const textEl = document.getElementById('toggleHistoryText');
            const chevronEl = document.getElementById('toggleChevron');

            if (isHistoryOpen) {
                wrapper.classList.remove('collapsed');
                textEl.textContent = 'ย่อรายการ';
                chevronEl.classList.remove('rotated');
            } else {
                wrapper.classList.add('collapsed');
                textEl.textContent = 'ดูรายการ';
                chevronEl.classList.add('rotated');
            }
        }

        function getCurrentBalance() {
            const raw = localStorage.getItem('balance');
            if (raw === null || isNaN(Number(raw))) {
                localStorage.setItem('balance', '10501');
                return 10501;
            }
            return Number(raw);
        }

        function updateBalanceDisplay() {
            document.getElementById('balanceAmount').textContent = getCurrentBalance().toLocaleString() + ' ฿';
        }

        function setAmount(amount) {
            document.getElementById('topupAmount').value = amount;
        }

        function previewSlip(event) {
            const file = event.target.files[0];
            const previewBox = document.getElementById('slipPreview');
            if (!file) {
                previewBox.classList.remove('show');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('slipImg').src = e.target.result;
                document.getElementById('slipName').textContent = 'ไฟล์สลิป: ' + file.name;
                previewBox.classList.add('show');
            };
            reader.readAsDataURL(file);
        }

        function topUpBalance() {
            const input = document.getElementById('topupAmount');
            const msgEl = document.getElementById('topupMsg');
            const amount = Number(input.value);

            if (!amount || amount <= 0) {
                msgEl.style.color = '#ff6b9d';
                msgEl.textContent = 'กรุณาระบุจำนวนเงินให้ถูกต้องครับ';
                return;
            }

            const newBalance = getCurrentBalance() + amount;
            localStorage.setItem('balance', String(newBalance));
            updateBalanceDisplay();

            input.value = '';
            document.getElementById('slipInput').value = '';
            document.getElementById('slipPreview').classList.remove('show');

            msgEl.style.color = '#00e676';
            msgEl.textContent = 'เติมเงินสำเร็จ +' + amount.toLocaleString() + ' บาท เรียบร้อยแล้วครับ!';
        }

        function logout() {
            // ล้างข้อมูลผู้ใช้ออกจากระบบอย่างสมบูรณ์
            localStorage.removeItem('currentUser');
            localStorage.removeItem('username');
            // นำทางกลับไปยังหน้าล็อกอินเริ่มต้น
            window.location.href = 'index.html';
        }

        function getThemeClass(concertName) {
            const upper = (concertName || '').toUpperCase();
            if (upper.includes('STARLIGHT')) return 'theme-starlight';
            if (upper.includes('CYBERPUNK')) return 'theme-cyberpunk';
            if (upper.includes('MIDNIGHT')) return 'theme-midnight';
            return '';
        }

        function renderBookings() {
            const savedUser = localStorage.getItem('currentUser') || localStorage.getItem('username') || 'paman';
            document.getElementById('profileName').textContent = savedUser;
            document.getElementById('profileAvatar').textContent = savedUser.charAt(0).toUpperCase();

            updateBalanceDisplay();

            const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
            const listEl = document.getElementById('ticketList');
            const badgeEl = document.getElementById('ticketCountBadge');

            badgeEl.textContent = bookings.length + ' รายการ';

            if (bookings.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        ยังไม่มีประวัติการจองบัตร ลองเลือกคอนเสิร์ตที่ถูกใจจากหน้าจองบัตรได้เลยครับ
                    </div>
                `;
                return;
            }

            const indexedBookings = bookings.map((item, idx) => ({ ...item, index: idx }));
            indexedBookings.reverse();

            listEl.innerHTML = indexedBookings.map((item) => {
                const ticketCode = item.ticketCode || ('#TKT-' + String(1001 + item.index));
                const concertTitle = item.concert || 'CONCERT TICKET';
                const zoneText = item.zone || '-';
                const qtyText = item.quantity ? (item.quantity + ' ใบ') : '1 ใบ';
                const priceText = item.totalPrice
                    ? (Number(item.totalPrice).toLocaleString() + ' บาท')
                    : 'ชำระแล้ว';
                const dateText = item.date || '-';
                const themeClass = getThemeClass(concertTitle);

                return `
                    <div class="e-ticket">
                        <div class="ticket-strip ${themeClass}"></div>
                        <div class="ticket-main">
                            <div class="ticket-top-row">
                                <span class="ticket-code">${ticketCode}</span>
                                <span class="ticket-status">✓ ยืนยันการจองแล้ว</span>
                            </div>
                            <div class="ticket-concert">${concertTitle}</div>
                            <div class="ticket-badges">
                                <span class="badge-item">โซน: <strong>${zoneText}</strong></span>
                                <span class="badge-item">จำนวน: <strong>${qtyText}</strong></span>
                            </div>
                            <div class="ticket-date">จองเมื่อ: ${dateText}</div>
                        </div>
                        <div class="ticket-side">
                            <div class="side-label">ยอดชำระรวม</div>
                            <div class="side-price">${priceText}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.onload = renderBookings;
    </script>

</body>
</html>
