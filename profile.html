<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์ของฉัน - CONCERT TICKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff2a85;
            --secondary: #7928ca;
            --accent: #00d2ff;
            --bg-dark: #0f0c29;
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
        }

        .profile-container {
            max-width: 600px;
            margin: 20px auto;
            background: rgba(20, 20, 40, 0.9);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .back-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .profile-info-card {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .avatar-large {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            border: 4px solid white;
        }

        .balance-box {
            margin-top: 15px;
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid var(--accent);
            padding: 15px;
            border-radius: 12px;
        }

        .balance-amount {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }

        .history-list {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            border-left: 4px solid var(--accent);
        }

        .topup-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .topup-preset {
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .topup-preset:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .custom-topup {
            display: flex;
            gap: 10px;
        }

        .custom-topup input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            outline: none;
        }

        .btn-topup {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-logout {
            background: #ff4757;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.2s;
        }

        .btn-logout:hover {
            filter: brightness(1.2);
        }

        /* --- สไตล์สำหรับ Popup QR Code --- */
        .qr-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .qr-modal-overlay.active {
            display: flex;
        }

        .qr-modal-box {
            background: #1a1638;
            border: 1px solid var(--accent);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.3);
        }

        .qr-image-wrapper {
            background: white;
            padding: 10px;
            border-radius: 15px;
            margin: 15px auto;
            max-width: 260px;
        }

        .qr-image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        .qr-amount-badge {
            background: rgba(0, 210, 255, 0.15);
            color: var(--accent);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-confirm-pay {
            flex: 2;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #2ed573;
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-confirm-pay:hover {
            filter: brightness(1.1);
        }

        .btn-cancel-pay {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: transparent;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="header-nav">
            <a href="app.html" class="back-link">← กลับไปหน้าจองบัตร</a>
            <h2>จัดการโปรไฟล์</h2>
        </div>

        <div class="profile-info-card">
            <div class="avatar-large" id="profileAvatar">U</div>
            <h2 id="profileUsername">Username</h2>
            <p id="profileDetails" style="font-size: 0.9rem; color: #bbb; margin-top: 5px;"></p>
            
            <div class="balance-box">
                <div style="font-size: 0.9rem; color: #ccc;">จำนวนเงินคงเหลือ</div>
                <div class="balance-amount"><span id="userBalance">0</span> ฿</div>
            </div>
        </div>

        <div>
            <h3 class="section-title">🎟️ ประวัติการจองตั๋ว</h3>
            <div id="historyList" class="history-list"></div>
        </div>

        <div>
            <h3 class="section-title">💳 ระบบเติมเงิน (สแกน QR Code)</h3>
            <div class="topup-grid">
                <button class="topup-preset" onclick="openQRModal(1000)">+1,000</button>
                <button class="topup-preset" onclick="openQRModal(3000)">+3,000</button>
                <button class="topup-preset" onclick="openQRModal(5000)">+5,000</button>
            </div>
            <div class="custom-topup">
                <input type="number" id="customTopup" placeholder="ระบุจำนวนเงินที่ต้องการเติม">
                <button class="btn-topup" onclick="openCustomQRModal()">เติมเงิน</button>
            </div>
        </div>

        <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
    </div>

    <!-- หน้าต่าง Popup แสดง QR Code -->
    <div id="qrModal" class="qr-modal-overlay">
        <div class="qr-modal-box">
            <h3 style="margin-bottom: 10px; color: white;">สแกน QR Code เพื่อเติมเงิน</h3>
            <div class="qr-amount-badge">ยอดชำระ: <span id="modalTopupAmount">0</span> ฿</div>
            
            <div class="qr-image-wrapper">
                <!-- เรียกใช้ไฟล์รูปภาพ qr.jpg -->
                <img src="qr.jpg" alt="Thai QR Payment PromptPay" onerror="this.src='https://via.placeholder.com/250x300?text=ไม่พบไฟล์+qr.jpg'">
            </div>
            
            <p style="font-size: 0.85rem; color: #ccc;">ชื่อบัญชี: นาย ปิยะเกียรติ เกตุไชโย<br>เมื่อโอนเงินเสร็จสิ้น กรุณากดปุ่มยืนยันด้านล่าง</p>
            
            <div class="modal-actions">
                <button class="btn-cancel-pay" onclick="closeQRModal()">ยกเลิก</button>
                <button class="btn-confirm-pay" onclick="confirmPayment()">✅ ยืนยันการชำระเงิน</button>
            </div>
        </div>
    </div>
