<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองบัตรคอนเสิร์ต - LIVE TICKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff2a85;
            --secondary: #7928ca;
            --accent: #00d2ff;
            --bg-dark: #0f0c29;
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--text-light);
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(15, 12, 41, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-link {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 15px 6px 6px;
            border-radius: 30px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.3s;
            text-decoration: none;
            color: white;
        }

        .profile-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .avatar-small {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent), var(--primary));
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .concert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .concert-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
        }

        .concert-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .concert-banner {
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
            padding: 15px;
        }

        .concert-body {
            padding: 20px;
        }

        .zone-select {
            width: 100%;
            padding: 10px;
            margin: 12px 0;
            border-radius: 8px;
            background: #1a1638;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-main {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-main:hover {
            filter: brightness(1.2);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">⚡ LIVE TICKET</div>
        <!-- ปุ่มลิงก์ไปหน้าแยก profile.html -->
        <a href="profile.html" class="profile-link">
            <div class="avatar-small" id="navAvatar">U</div>
            <span id="navUsername">Username</span>
        </a>
    </nav>

    <div class="container">
        <h2>🔥 คอนเสิร์ตที่เปิดให้กดบัตรขณะนี้</h2>
        <div class="concert-grid">
            <div class="concert-card">
                <div class="concert-banner" style="background: linear-gradient(45deg, #ff007f, #7928ca);">NEON WORLD TOUR</div>
                <div class="concert-body">
                    <h3>NEON WORLD TOUR IN BANGKOK</h3>
                    <select id="zone1" class="zone-select">
                        <option value="VIP - 5,500|5500">โซน VIP - 5,500 บาท</option>
                        <option value="Zone A - 3,500|3500">โซน A - 3,500 บาท</option>
                    </select>
                    <button class="btn-main" onclick="bookTicket('NEON WORLD TOUR', 'zone1')">จองบัตร</button>
                </div>
            </div>
            <div class="concert-card">
                <div class="concert-banner" style="background: linear-gradient(45deg, #00d2ff, #3a7bd5);">STARLIGHT FEST</div>
                <div class="concert-body">
                    <h3>STARLIGHT MUSIC FEST</h3>
                    <select id="zone2" class="zone-select">
                        <option value="VVIP - 6,000|6000">โซน VVIP - 6,000 บาท</option>
                        <option value="Regular - 2,500|2500">โซน Regular - 2,500 บาท</option>
                    </select>
                    <button class="btn-main" onclick="bookTicket('STARLIGHT MUSIC FEST', 'zone2')">จองบัตร</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function checkUser() {
            const currentUser = localStorage.getItem('current_user');
            if (!currentUser) {
                window.location.href = 'index.html';
                return;
            }
            const users = JSON.parse(localStorage.getItem('concert_users'));
            if (!users || !users[currentUser]) {
                window.location.href = 'index.html';
                return;
            }

            const firstLetter = currentUser.charAt(0).toUpperCase();
            document.getElementById('navAvatar').innerText = firstLetter;
            document.getElementById('navUsername').innerText = currentUser;
        }

        function bookTicket(concertName, selectId) {
            const select = document.getElementById(selectId);
            const [zoneLabel, priceStr] = select.value.split('|');
            const price = parseInt(priceStr);

            const currentUser = localStorage.getItem('current_user');
            let users = JSON.parse(localStorage.getItem('concert_users'));
            let userData = users[currentUser];

            if (userData.balance < price) {
                alert(`ยอดเงินไม่เพียงพอ! (ต้องการ ${price.toLocaleString()} บาท)\nกรุณาไปที่หน้าโปรไฟล์เพื่อเติมเงิน`);
                return;
            }

            userData.balance -= price;
            const now = new Date().toLocaleString('th-TH');
            if (!userData.history) userData.history = [];
            userData.history.unshift({
                concert: concertName,
                zone: zoneLabel,
                date: now
            });

            localStorage.setItem('concert_users', JSON.stringify(users));
            alert(`🎉 จองบัตรสำเร็จ!\nคอนเสิร์ต: ${concertName}\nโซน: ${zoneLabel}`);
        }

        window.onload = checkUser;
    </script>
</body>
</html>
