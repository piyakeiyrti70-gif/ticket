<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลัก - CONCERT TICKET</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff2a85;
            --secondary: #7928ca;
            --accent: #00d2ff;
            --bg-dark: #0f0c29;
            --text-light: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: var(--text-light); min-height: 100vh; }
        
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: rgba(15, 12, 41, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 1.5rem; font-weight: 700; background: linear-gradient(to right, var(--accent), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .profile-trigger {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.1); padding: 6px 15px 6px 6px;
            border-radius: 30px; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .avatar-small {
            width: 35px; height: 35px; border-radius: 50%;
            background: linear-gradient(45deg, var(--accent), var(--primary));
            display: flex; justify-content: center; align-items: center; font-weight: bold;
        }

        .profile-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
            z-index: 200; justify-content: flex-end;
        }
        .profile-drawer {
            width: 100%; max-width: 380px; background: #1a1638; height: 100%;
            padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px;
        }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; }
        .close-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }

        .profile-info-card { text-align: center; background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 15px; }
        .avatar-large {
            width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 10px;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold;
        }
        .balance-box { margin-top: 15px; background: rgba(0, 210, 255, 0.15); border: 1px solid var(--accent); padding: 10px; border-radius: 10px; }
        .balance-amount { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

        .drawer-section { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 15px; }
        .drawer-section h3 { font-size: 1.1rem; margin-bottom: 12px; color: var(--primary); border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 5px; }
        .history-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item { background: rgba(0, 0, 0, 0.3); padding: 10px; border-radius: 8px; font-size: 0.85rem; border-left: 3px solid var(--accent); }

        .topup-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .topup-preset { padding: 8px; background: rgba(255, 255, 255, 0.1); border: none; color: white; border-radius: 8px; cursor: pointer; }
        .topup-preset:hover { background: var(--primary); }

        .btn-logout { background: #ff4757; color: white; border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: 600; margin-top: auto; }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .concert-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .concert-card { background: rgba(255, 255, 255, 0.08); border-radius: 16px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); }
        .concert-banner { height: 150px; display: flex; justify-content: center; align-items: center; font-size: 1.4rem; font-weight: bold; text-align: center; }
        .concert-body { padding: 20px; }
        .zone-select { width: 100%; padding: 10px; margin: 12px 0; border-radius: 8px; background: #1a1638; color: white; }
        .btn-main { width: 100%; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(45deg, var(--primary), var(--secondary)); color: white; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">⚡ LIVE TICKET</div>
        <div class="profile-trigger" onclick="toggleProfile(true)">
            <div class="avatar-small" id="navAvatar">U</div>
            <span id="navUsername">Username</span>
        </div>
    </nav>

    <div class="container">
        <h2>🔥 คอนเสิร์ตที่เปิดให้กดบัตรขณะนี้</h2>
        <div class="concert-grid">
            <div class="concert-card">
                <div class="concert-banner" style="background: linear-gradient(45deg, #ff007f, #7928ca);">NEON WORLD TOUR</div>
                <div class="concert-body">
                    <h3>NEON WORLD TOUR IN BANGKOK</h3>
                    <select id="zone1" class="zone-select">
                        <option value="VIP - 5,500|5500">โซน VIP - 5,500 บาท</option>
                        <option value="Zone A - 3,500|3500">โซน A - 3,500 บาท</option>
                    </select>
                    <button class="btn-main" onclick="bookTicket('NEON WORLD TOUR', 'zone1')">จองบัตร</button>
                </div>
            </div>
            <div class="concert-card">
                <div class="concert-banner" style="background: linear-gradient(45deg, #00d2ff, #3a7bd5);">STARLIGHT FEST</div>
                <div class="concert-body">
                    <h3>STARLIGHT MUSIC FEST</h3>
                    <select id="zone2" class="zone-select">
                        <option value="VVIP - 6,000|6000">โซน VVIP - 6,000 บาท</option>
                        <option value="Regular - 2,500|2500">โซน Regular - 2,500 บาท</option>
                    </select>
                    <button class="btn-main" onclick="bookTicket('STARLIGHT MUSIC FEST', 'zone2')">จองบัตร</button>
                </div>
            </div>
        </div>
    </div>

    <div id="profileOverlay" class="profile-overlay" onclick="closeProfileOutside(event)">
        <div class="profile-drawer">
            <div class="drawer-header">
                <h3>โปรไฟล์ของฉัน</h3>
                <button class="close-btn" onclick="toggleProfile(false)">&times;</button>
            </div>

            <div class="profile-info-card">
                <div class="avatar-large" id="drawerAvatar">U</div>
                <h3 id="drawerUsername">Username</h3>
                <p id="drawerDetails" style="font-size: 0.8rem; color: #bbb;"></p>
                <div class="balance-box">
                    <div>จำนวนเงินคงเหลือ</div>
                    <div class="balance-amount"><span id="userBalance">0</span> ฿</div>
                </div>
            </div>

            <div class="drawer-section">
                <h3>🎟️ ประวัติการจองตั๋ว</h3>
                <div id="historyList" class="history-list"></div>
            </div>

            <div class="drawer-section">
                <h3>💳 ระบบเติมเงิน</h3>
                <div class="topup-grid">
                    <button class="topup-preset" onclick="topUp(1000)">+1,000</button>
                    <button class="topup-preset" onclick="topUp(3000)">+3,000</button>
                    <button class="topup-preset" onclick="topUp(5000)">+5,000</button>
                </div>
            </div>

            <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
        </div>
    </div>

    <script>
        function loadUserData() {
            const currentUser = localStorage.getItem('current_user');
            if (!currentUser) {
                window.location.href = 'index.html';
                return;
            }
            const users = JSON.parse(localStorage.getItem('concert_users'));
            const userData = users[currentUser];

            const firstLetter = currentUser.charAt(0).toUpperCase();
            document.getElementById('navAvatar').innerText = firstLetter;
            document.getElementById('navUsername').innerText = currentUser;
            document.getElementById('drawerAvatar').innerText = firstLetter;
            document.getElementById('drawerUsername').innerText = currentUser;
            document.getElementById('drawerDetails').innerText = `${userData.email} | ${userData.phone}`;
            
            updateProfileUI();
        }

        function updateProfileUI() {
            const currentUser = localStorage.getItem('current_user');
            const users = JSON.parse(localStorage.getItem('concert_users'));
            const userData = users[currentUser];

            document.getElementById('userBalance').innerText = userData.balance.toLocaleString();

            const historyList = document.getElementById('historyList');
            if (userData.history.length === 0) {
                historyList.innerHTML = '<p style="color: #888; font-size: 0.85rem; text-align: center;">ยังไม่มีประวัติการจอง</p>';
            } else {
                historyList.innerHTML = userData.history.map(item => `
                    <div class="history-item">
                        <strong>${item.concert}</strong><br>
