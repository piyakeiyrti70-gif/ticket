<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองตั๋วคอนเสิร์ตและกระเป๋าเงิน</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            --accent-color: #ffd700;
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.1);
            margin: 10px;
        }

        h1 {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        .subtitle { color: #a5a5c7; margin-bottom: 1.5rem; font-size: 0.95rem; }

        .form-group { text-align: left; margin-bottom: 1rem; }

        label { display: block; margin-bottom: 0.5rem; color: #e2e2e2; }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #0f3460;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus, select:focus { outline: 2px solid #e94560; }

        button.main-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--primary-gradient);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        button.main-btn:hover { transform: translateY(-3px); }

        .toggle-link { margin-top: 1.5rem; font-size: 0.9rem; color: #a5a5c7; }
        .toggle-link a { color: var(--accent-color); text-decoration: none; font-weight: bold; }

        .hidden { display: none; }

        /* Profile & Wallet Section */
        .profile-header {
            display: flex;
            align-items: center;
            background: #0f3460;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: left;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .wallet-card {
            background: linear-gradient(135deg, #1f4068 0%, #162447 100%);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--accent-color);
        }

        .balance-amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .history-section {
            text-align: left;
            background: #0f3460;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            font-size: 0.9rem;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .ticket-box {
            border: 2px dashed var(--accent-color);
            padding: 15px;
            border-radius: 10px;
            background: #16213e;
            margin-bottom: 15px;
        }

        .logout-btn { background: #e94560 !important; margin-top: 10px; }
    </style>
</head>
<body>

<!-- Login / Register Panel -->
<div class="container" id="auth-panel">
    <h1 id="auth-title">เข้าสู่ระบบ</h1>
    <p class="subtitle">ยินดีต้อนรับสู่ระบบจองบัตรคอนเสิร์ต</p>
    
    <div class="form-group">
        <label>ชื่อผู้ใช้งาน</label>
        <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้">
    </div>

    <div class="form-group">
        <label>รหัสผ่าน</label>
        <input type="password" id="password" placeholder="กรอกรหัสผ่าน">
    </div>

    <div id="register-fields" class="hidden">
        <div class="form-group">
            <label>เบอร์โทรศัพท์</label>
            <input type="tel" id="phone" placeholder="0812345678">
        </div>
        <div class="form-group">
            <label>อีเมล</label>
            <input type="email" id="email" placeholder="example@email.com">
        </div>
    </div>

    <button class="main-btn" id="auth-btn" onclick="handleAuth()">เข้าสู่ระบบ</button>

    <p class="toggle-link" id="toggle-text">ยังไม่มีบัญชี? <a href="#" onclick="toggleMode(event)">สมัครสมาชิก</a></p>
</div>

<!-- Booking & Profile Panel -->
<div class="container hidden" id="main-panel">
    <div class="profile-header">
        <div class="avatar" id="user-avatar">U</div>
        <div>
            <h3 style="margin:0;" id="disp-user">Username</h3>
            <span style="font-size: 0.85rem; color: #a5a5c7;" id="disp-email">email@example.com</span>
        </div>
    </div>

    <div class="wallet-card">
        <div>ยอดเงินคงเหลือของคุณ</div>
        <div class="balance-amount"><span id="wallet-balance">500</span> บาท</div>
        <div style="margin-top: 10px;">
            <input type="number" id="topup-amount" placeholder="ระบุจำนวนเงิน" style="width: 120px; padding: 5px; font-size: 0.9rem;">
            <button onclick="topupMoney()" style="padding: 6px 15px; border-radius: 5px; border: none; background: #28a745; color: white; cursor: pointer; font-weight: bold;">เติมเงิน</button>
        </div>
    </div>

    <div class="ticket-box">
        <h3>จองบัตรคอนเสิร์ตฮิต</h3>
        <div class="form-group" style="margin-bottom: 10px;">
            <label style="font-size: 0.9rem;">เลือกโซน</label>
            <select id="ticket-type" onchange="updatePrice()">
                <option value="500">โซน Regular - 500 บาท</option>
                <option value="1500">โซน A - 1,500 บาท</option>
                <option value="3000">โซน VIP - 3,000 บาท</option>
            </select>
        </div>
        <div class="form-group">
            <label style="font-size: 0.9rem;">จำนวนใบ</label>
            <input type="number" id="ticket-amount" min="1" max="5" value="1" onchange="updatePrice()">
        </div>
        <div style="font-size: 1.1rem; font-weight: bold; margin: 10px 0;">รวมเป็นเงิน: <span id="total-price">500</span> บาท</div>
        <button class="main-btn" onclick="bookTicket()">ยืนยันการจอง</button>
    </div>

    <h4>ประวัติการจองตั๋ว</h4>
    <div class="history-section" id="booking-history">
        <div class="history-item" style="color: #6c757d;">ยังไม่มีประวัติการจอง</div>
    </div>

    <button class="main-btn logout-btn" onclick="logout()">ออกจากระบบ</button>
</div>

<script>
    let isLoginMode = true;
    let registeredUsers = {};
    let currentUser = "";
    let userWallet = 0;
    let bookingHistory = [];

    function toggleMode(event) {
        event.preventDefault();
        isLoginMode = !isLoginMode;
        const title = document.getElementById('auth-title');
        const btn = document.getElementById('auth-btn');
        const toggleText = document.getElementById('toggle-text');
        const regFields = document.getElementById('register-fields');

        if (isLoginMode) {
            title.innerText = "เข้าสู่ระบบ";
            btn.innerText = "เข้าสู่ระบบ";
            toggleText.innerHTML = 'ยังไม่มีบัญชี? <a href="#" onclick="toggleMode(event)">สมัครสมาชิก</a>';
            regFields.classList.add('hidden');
        } else {
            title.innerText = "สมัครสมาชิก";
            btn.innerText = "ลงทะเบียน";
            toggleText.innerHTML = 'มีบัญชีอยู่แล้ว? <a href="#" onclick="toggleMode(event)">เข้าสู่ระบบ</a>';
            regFields.classList.remove('hidden');
        }
    }

    function handleAuth() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();

        if (!user || !pass || (!isLoginMode && (!phone || !email))) {
            alert("กรุณากรอกข้อมูลให้ครบถ้วนครับ");
            return;
        }

        if (isLoginMode) {
            if (registeredUsers[user] && registeredUsers[user].password === pass) {
                currentUser = user;
                userWallet = registeredUsers[user].wallet;
                bookingHistory = registeredUsers[user].history;
                showMainPanel(registeredUsers[user]);
            } else {
                alert("ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง");
            }
        } else {
            if (registeredUsers[user]) {
                alert("ชื่อผู้ใช้นี้มีผู้ใช้งานแล้ว");
            } else {
                registeredUsers[user] = { 
                    password: pass, 
                    phone: phone, 
                    email: email,
                    wallet: 500,
                    history: []
                };
                alert("สมัครสมาชิกสำเร็จ! (แถมฟรีเค
