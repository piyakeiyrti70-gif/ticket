<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองตั๋วคอนเสิร์ตและกระเป๋าเงิน</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            --accent-color: #ffd700;
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.1);
        }

        h1 {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        .subtitle { color: #a5a5c7; margin-bottom: 1.5rem; font-size: 0.95rem; }

        .form-group { text-align: left; margin-bottom: 1.2rem; }

        label { display: block; margin-bottom: 0.5rem; color: #e2e2e2; font-size: 1rem; }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #0f3460;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus, select:focus { outline: 2px solid #e94560; }

        button.main-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--primary-gradient);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        button.main-btn:hover { transform: translateY(-3px); }

        .toggle-section {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .toggle-text { font-size: 0.95rem; color: #a5a5c7; margin-bottom: 8px; }

        .action-toggle-btn {
            background: transparent;
            border: 1px solid #e94560;
            color: #ff9a9e;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-toggle-btn:hover {
            background: #e94560;
            color: white;
        }

        .hidden { display: none; }

        /* Profile & Wallet Section */
        .profile-header {
            display: flex;
            align-items: center;
            background: #0f3460;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: left;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .wallet-card {
            background: linear-gradient(135deg, #1f4068 0%, #162447 100%);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--accent-color);
        }

        .balance-amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 5px 0;
        }

        .history-section {
            text-align: left;
            background: #0f3460;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            max-height: 140px;
            overflow-y: auto;
        }

        .history-item {
            font-size: 0.95rem;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .ticket-box {
            border: 2px dashed var(--accent-color);
            padding: 15px;
            border-radius: 12px;
            background: #16213e;
            margin-bottom: 15px;
        }

        .logout-btn { background: #333 !important; padding: 10px !important; font-size: 1rem !important; }

        /* Bottom Status Indicator */
        #app-status {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: #00ffcc;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            pointer-events: none;
            border: 1px solid #00ffcc;
        }
    </style>
</head>
<body>

<!-- Login Panel -->
<div class="container" id="login-panel">
    <h1 id="panel-title">เข้าสู่ระบบ</h1>
    <p class="subtitle" id="panel-subtitle">ยินดีต้อนรับสู่ระบบจองบัตรคอนเสิร์ต</p>
    
    <form id="auth-form" onsubmit="event.preventDefault(); handleAuth();">
        <div class="form-group">
            <label>ชื่อผู้ใช้งาน</label>
            <input type="text" id="username" required placeholder="กรอกชื่อผู้ใช้">
        </div>

        <div class="form-group">
            <label>รหัสผ่าน</label>
            <input type="password" id="password" required placeholder="กรอกรหัสผ่าน">
        </div>

        <div id="register-fields" class="hidden">
            <div class="form-group">
                <label>เบอร์โทรศัพท์</label>
                <input type="tel" id="phone" placeholder="0812345678">
            </div>
            <div class="form-group">
                <label>อีเมล</label>
                <input type="email" id="email" placeholder="example@email.com">
            </div>
        </div>

        <button type="submit" class="main-btn" id="submit-btn">เข้าสู่ระบบ</button>
    </form>

    <div class="toggle-section">
        <div class="toggle-text" id="toggle-text">ยังไม่มีบัญชีใช่ไหม?</div>
        <button class="action-toggle-btn" id="toggle-action-btn" onclick="switchMode()">ไปหน้าสมัครสมาชิก</button>
    </div>
</div>

<!-- Booking & Profile Panel -->
<div class="container hidden" id="main-panel">
    <div class="profile-header">
        <div class="avatar" id="user-avatar">U</div>
        <div>
            <h3 style="margin:0; font-size: 1.3rem;" id="disp-user">Username</h3>
            <span style="font-size: 0.9rem; color: #a5a5c7;" id="disp-email">email@example.com</span>
        </div>
    </div>

    <div class="wallet-card">
        <div style="font-size: 0.95rem;">ยอดเงินคงเหลือของคุณ</div>
        <div class="balance-amount"><span id="wallet-balance">500</span> บาท</div>
        <div style="display: flex; gap: 8px; margin-top: 10px;">
            <input type="number" id="topup-amount" placeholder="ระบุจำนวนเงิน" style="flex-grow: 1; padding: 8px;">
            <button onclick="topupMoney()" style="padding: 8px 15px; border-radius: 8px; border: none; background: #28a745; color: white; cursor: pointer; font-weight: bold; font-size: 0.9rem;">เติมเงิน</button>
        </div>
    </div>

    <div class="ticket-box">
        <h3 style="margin-top: 0; font-size: 1.2rem;">จองบัตรคอนเสิร์ตฮิต</h3>
        <div class="form-group" style="margin-bottom: 10px;">
            <label style="font-size: 0.9rem;">เลือกโซนที่นั่ง</label>
            <select id="ticket-type" onchange="updatePrice()">
                <option value="500">โซน Regular - 500 บาท</option>
                <option value="1500">โซน A - 1,500 บาท</option>
                <option value="3000">โซน VIP - 3,000 บาท</option>
            </select>
        </div>
        <div class="form-group" style="margin-bottom: 10px;">
            <label style="font-size: 0.9rem;">จำนวนใบ</label>
            <input type="number" id="ticket-amount" min="1" max="5" value="1" onchange="updatePrice()">
        </div>
        <div style="font-size: 1.1rem; font-weight: bold; margin: 12px 0; color: var(--accent-color);">รวมเป็นเงิน: <span id="total-price">500</span> บาท</div>
        <button class="main-btn" style="padding: 12px; margin-top: 0;" onclick="bookTicket()">ยืนยันการจอง</button>
    </div>

    <h4 style="text-align: left; margin-bottom: 8px; font-size: 1.1rem;">ประวัติการจองตั๋ว</h4>
    <div class="history-section" id="booking-history">
        <div class="history-item" style="color: #6c757d;">ยังไม่มีประวัติการจอง</div>
    </div>

    <button class="main-btn logout-btn" onclick="logout()">ออกจากระบบ</button>
</div>

<div id="app-status">ระบบพร้อมใช้งาน</div>

<script>
    let isLoginMode = true;
    let registeredUsers = {};
    let currentUser = "";
    let userWallet = 0;
    let bookingHistory = [];

    function switchMode() {
        isLoginMode = !isLoginMode;
        const panelTitle = document.getElementById('panel-title');
        const panelSubtitle = document.getElementById('panel-subtitle');
        const submitBtn = document.getElementById('submit-btn');
        const toggleText = document.getElementById('toggle-text');
        const toggleActionBtn = document.getElementById('toggle-action-btn');
        const registerFields = document.getElementById('register-fields');
        const form = document.getElementById('auth-form');

        if (isLoginMode) {
            panelTitle.innerText = "เข้าสู่ระบบ";
            panelSubtitle.innerText = "ยินดีต้อ
