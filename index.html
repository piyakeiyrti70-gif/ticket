<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองตั๋วคอนเสิร์ตและกระเป๋าเงิน</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            --accent-color: #ffd700;
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.1);
            margin: 10px;
        }

        h1 {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        .subtitle { color: #a5a5c7; margin-bottom: 2rem; font-size: 1rem; }

        .form-group { text-align: left; margin-bottom: 1.5rem; }

        label { display: block; margin-bottom: 0.5rem; color: #e2e2e2; font-size: 1.1rem; }

        input, select {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: #0f3460;
            color: white;
            font-size: 1.1rem;
            box-sizing: border-box;
        }

        input:focus, select:focus { outline: 2px solid #e94560; }

        button.main-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            background: var(--primary-gradient);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 15px;
        }

        button.main-btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(255,8,68,0.4); }

        /* ปรับปรุงปุ่มสลับโหมดให้กดง่าย เป็นกล่องขนาดใหญ่ */
        .mode-toggle-area {
            margin-top: 2.5rem;
            padding: 15px;
            background: #0f3460;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .toggle-text { font-size: 1.1rem; color: #a5a5c7; margin-bottom: 10px; }

        .toggle-btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: #e94560;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .hidden { display: none; }

        /* Profile & Wallet Section */
        .profile-header {
            display: flex;
            align-items: center;
            background: #0f3460;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .wallet-card {
            background: linear-gradient(135deg, #1f4068 0%, #162447 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--accent-color);
        }

        .balance-amount {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 10px 0;
        }

        .history-section {
            text-align: left;
            background: #0f3460;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            max-height: 180px;
            overflow-y: auto;
        }

        .history-item {
            font-size: 1rem;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .ticket-box {
            border: 2px dashed var(--accent-color);
            padding: 20px;
            border-radius: 15px;
            background: #16213e;
            margin-bottom: 20px;
        }

        .logout-btn { background: #333 !important; margin-top: 15px; }
    </style>
</head>
<body>

<!-- Login / Register Panel -->
<div class="container" id="auth-panel">
    <h1 id="auth-title">เข้าสู่ระบบ</h1>
    <p class="subtitle">ยินดีต้อนรับสู่ระบบจองบัตรคอนเสิร์ต</p>
    
    <div class="form-group">
        <label>ชื่อผู้ใช้งาน</label>
        <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้">
    </div>

    <div class="form-group">
        <label>รหัสผ่าน</label>
        <input type="password" id="password" placeholder="กรอกรหัสผ่าน">
    </div>

    <div id="register-fields" class="hidden">
        <div class="form-group">
            <label>เบอร์โทรศัพท์</label>
            <input type="tel" id="phone" placeholder="0812345678">
        </div>
        <div class="form-group">
            <label>อีเมล</label>
            <input type="email" id="email" placeholder="example@email.com">
        </div>
    </div>

    <button class="main-btn" id="auth-btn" onclick="handleAuth()">เข้าสู่ระบบ</button>

    <!-- พื้นที่กดสลับโหมดแบบใหม่ ขนาดใหญ่ ชัดเจน -->
    <div class="mode-toggle-area">
        <div class="toggle-text" id="toggle-text">ยังไม่มีบัญชีใช่ไหม?</div>
        <a href="#" class="toggle-btn" id="toggle-link-btn" onclick="toggleMode(event)">ไปหน้าสมัครสมาชิก</a>
    </div>
</div>

<!-- Booking & Profile Panel -->
<div class="container hidden" id="main-panel">
    <div class="profile-header">
        <div class="avatar" id="user-avatar">U</div>
        <div>
            <h3 style="margin:0; font-size: 1.4rem;" id="disp-user">Username</h3>
            <span style="font-size: 1rem; color: #a5a5c7;" id="disp-email">email@example.com</span>
        </div>
    </div>

    <div class="wallet-card">
        <div style="font-size: 1.1rem;">ยอดเงินคงเหลือของคุณ</div>
        <div class="balance-amount"><span id="wallet-balance">500</span> บาท</div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <input type="number" id="topup-amount" placeholder="ระบุจำนวนเงิน" style="flex-grow: 1;">
            <button onclick="topupMoney()" style="padding: 12px 20px; border-radius: 10px; border: none; background: #28a745; color: white; cursor: pointer; font-weight: bold; font-size: 1rem;">เติมเงิน</button>
        </div>
    </div>

    <div class="ticket-box">
        <h3 style="margin-top: 0;">จองบัตรคอนเสิร์ตฮิต</h3>
        <div class="form-group">
            <label>เลือกโซนที่นั่ง</label>
            <select id="ticket-type" onchange="updatePrice()">
                <option value="500">โซน Regular - 500 บาท</option>
                <option value="1500">โซน A - 1,500 บาท</option>
                <option value="3000">โซน VIP - 3,000 บาท</option>
            </select>
        </div>
        <div class="form-group">
            <label>จำนวนใบ</label>
            <input type="number" id="ticket-amount" min="1" max="5" value="1" onchange="updatePrice()">
        </div>
        <div style="font-size: 1.3rem; font-weight: bold; margin: 15px 0; color: var(--accent-color);">รวมเป็นเงิน: <span id="total-price">500</span> บาท</div>
        <button class="main-btn" onclick="bookTicket()">ยืนยันการจอง</button>
    </div>

    <h4 style="text-align: left; margin-bottom: 10px; font-size: 1.2rem;">ประวัติการจองตั๋ว</h4>
    <div class="history-section" id="booking-history">
        <div class="history-item" style="color: #6c757d;">ยังไม่มีประวัติการจอง</div>
    </div>

    <button class="main-btn logout-btn" onclick="logout()">ออกจากระบบ</button>
</div>

<script>
    let isLoginMode = true;
    let registeredUsers = {};
    let currentUser = "";
    let userWallet = 0;
    let bookingHistory = [];

    function toggleMode(event) {
        event.preventDefault();
        isLoginMode = !isLoginMode;
        const title = document.getElementById('auth-title');
        const btn = document.getElementById('auth-btn');
        const toggleText = document.getElementById('toggle-text');
        const toggleBtn = document.getElementById('toggle-link-btn');
        const regFields = document.getElementById('register-fields');

        if (isLoginMode) {
            title.innerText = "เข้าสู่ระบบ";
            btn.innerText = "เข้าสู่ระบบ";
            toggleText.innerText = "ยังไม่มีบัญชีใช่ไหม?";
            toggleBtn.innerText = "ไปหน้าสมัครสมาชิก";
            regFields.classList.add('hidden');
        } else {
            title.innerText = "สมัครสมาชิก";
            btn.innerText = "ลงทะเบียน";
            toggleText.innerText = "มีบัญชีอยู่แล้วใช่ไหม?";
            toggleBtn.innerText = "ไปหน้าเข้าสู่ระบบ";
            regFields.classList.remove('hidden');
        }
    }

    function handleAuth() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();

        if (!user ||
