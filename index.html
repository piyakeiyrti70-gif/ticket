<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - จองตั๋วคอนเสิร์ต</title>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-card {
            background: #16213e;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 350px;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.1);
        }

        h1 {
            color: #ff0844;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        p.subtitle {
            color: #a5a5c7;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #e2e2e2;
            font-size: 0.9imp>

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #0f3460;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: 2px solid #ff0844;
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s;
        }

        .auth-btn:hover {
            transform: translateY(-3px);
        }

        .toggle-link {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #a5a5c7;
        }

        .toggle-link a {
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h1 id="title">เข้าสู่ระบบ</h1>
    <p class="subtitle">กรุณากรอกข้อมูลเพื่อเข้าใช้งาน</p>
    
    <div class="form-group">
        <label for="username">ชื่อผู้ใช้งาน</label>
        <input type="text" id="username" placeholder="ใส่ชื่อผู้ใช้ของคุณ">
    </div>

    <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" placeholder="ใส่รหัสผ่านของคุณ">
    </div>

    <div id="extra-fields" class="hidden">
        <div class="form-group">
            <label for="phone">เบอร์โทรศัพท์</label>
            <input type="tel" id="phone" placeholder="0812345678">
        </div>
        <div class="form-group">
            <label for="email">อีเมล</label>
            <input type="email" id="email" placeholder="example@email.com">
        </div>
    </div>

    <button class="auth-btn" id="submit-btn" onclick="processAuth()">เข้าสู่ระบบ</button>

    <div class="toggle-link" id="toggle-container">
        ยังไม่มีบัญชี? <a href="#" onclick="toggleMode(event)">สมัครสมาชิก</a>
    </div>
</div>

<script>
    let isLogin = true;

    function toggleMode(e) {
        e.preventDefault();
        isLogin = !isLogin;
        const title = document.getElementById('title');
        const submitBtn = document.getElementById('submit-btn');
        const toggleContainer = document.getElementById('toggle-container');
        const extraFields = document.getElementById('extra-fields');

        if (isLogin) {
            title.innerText = "เข้าสู่ระบบ";
            submitBtn.innerText = "เข้าสู่ระบบ";
            toggleContainer.innerHTML = 'ยังไม่มีบัญชี? <a href="#" onclick="toggleMode(event)">สมัครสมาชิก</a>';
            extraFields.classList.add('hidden');
        } else {
            title.innerText = "สมัครสมาชิก";
            submitBtn.innerText = "ลงทะเบียน";
            toggleContainer.innerHTML = 'มีบัญชีอยู่แล้ว? <a href="#" onclick="toggleMode(event)">เข้าสู่ระบบ</a>';
            extraFields.classList.remove('hidden');
        }
    }

    function processAuth() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if(!user || !pass) {
            alert('กรุณากรอกข้อมูลให้ครบถ้วน');
            return;
        }

        if (isLogin) {
            alert('เข้าสู่ระบบสำเร็จ! กำลังพาไปหน้าจองตั๋ว');
        } else {
            alert('ลงทะเบียนสำเร็จ! กำลังพาไปหน้าจองตั๋ว');
        }
        
        // สั่งเปลี่ยนหน้าไปยัง booking.html
        window.location.href = 'booking.html';
    }
</script>

</body>
</html>
